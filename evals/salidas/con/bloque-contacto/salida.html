<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto · Nehemias Pérez</title>
<style>
  :root {
    --color-tinta: #0E1116; --color-texto: #2B2F36; --color-apagado: #6A707A;
    --color-linea: #DADDE2; --color-fondo: #FAFAF8; --color-blanco: #FFFFFF; --color-azul: #043565;
    --font-titulo: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --font-texto: "Instrument Sans", system-ui, sans-serif;
    --font-weight-extranegrita: 800; --font-weight-negrita: 700;
    --text-xs: 12px; --text-xs--line-height: 16px;
    --text-sm: 14px; --text-sm--line-height: 20px;
    --text-2xl: 28px; --text-2xl--line-height: 34px;
    --tracking-titulo: -0.02em; --tracking-eyebrow: 0.12em;
    --spacing-sm: 8px; --spacing-md: 12px; --spacing-lg: 24px; --spacing-3xl: 64px;
    --radius-md: 10px;
  }
  body { margin: 0; padding: var(--spacing-3xl) var(--spacing-lg); background: var(--color-fondo); font: var(--text-sm)/var(--text-sm--line-height) var(--font-texto); color: var(--color-texto); }
  .contacto { max-width: 640px; margin: 0 auto; display: flex; gap: var(--spacing-lg); align-items: center; justify-content: space-between; padding: var(--spacing-lg); border-top: 1px solid var(--color-linea); }
  .contacto__eyebrow { margin: 0 0 var(--spacing-sm); font-size: var(--text-xs); line-height: var(--text-xs--line-height); font-weight: var(--font-weight-negrita); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--color-azul); }
  .contacto__nombre { margin: 0; font: var(--font-weight-extranegrita) var(--text-2xl)/var(--text-2xl--line-height) var(--font-titulo); letter-spacing: var(--tracking-titulo); color: var(--color-tinta); }
  .contacto__titulo { margin: 0 0 var(--spacing-md); color: var(--color-azul); font-weight: var(--font-weight-negrita); }
  .contacto__lista { display: grid; grid-template-columns: auto 1fr; gap: var(--spacing-sm) var(--spacing-md); margin: 0; }
  .contacto__lista dt { color: var(--color-apagado); }
  .contacto__lista dd { margin: 0; }
  .contacto__lista a { color: var(--color-azul); }
  .contacto__qr { flex: none; width: 120px; height: 120px; box-sizing: content-box; background: var(--color-blanco); padding: var(--spacing-md); border: 1px solid var(--color-linea); border-radius: var(--radius-md); }
  .contacto__qr svg { display: block; width: 100%; height: 100%; }
  @media (max-width: 480px) { .contacto { flex-direction: column-reverse; align-items: flex-start; } }
</style>
</head>
<body>
<section class="contacto" aria-label="Contacto">
  <div class="contacto__datos">
    <p class="contacto__eyebrow">Hablemos</p>
    <h2 class="contacto__nombre">Nehemias Pérez</h2>
    <p class="contacto__titulo">Diseñador UI/UX</p>
    <dl class="contacto__lista">
      <dt>Web</dt><dd><a href="https://nehemiasperez.com">nehemiasperez.com</a></dd>
      <dt>Correo</dt><dd><a href="mailto:correo@ejemplo.com">correo@ejemplo.com</a></dd>
    </dl>
  </div>
  <div class="contacto__qr" id="qr" role="img" aria-label="Código QR al portafolio: nehemiasperez.com"><noscript><a href="https://nehemiasperez.com">nehemiasperez.com</a></noscript></div>
</section>

<script>
// Generador de QR (byte, corrección M, versiones 1–5), sin dependencias.
function crearQR(texto) {
  const datos = Array.from(new TextEncoder().encode(texto));
  const ECC = [0, 10, 16, 26, 18, 24], BLQ = [0, 1, 1, 1, 2, 2];
  const crudos = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; } return r; };
  let ver = 1;
  while (ver <= 5 && 12 + 8 * datos.length > (Math.floor(crudos(ver) / 8) - ECC[ver] * BLQ[ver]) * 8) ver++;
  if (ver > 5) throw new Error("Texto demasiado largo");
  const cap = Math.floor(crudos(ver) / 8) - ECC[ver] * BLQ[ver];
  const bits = [];
  const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  push(4, 4); push(datos.length, 8); datos.forEach(b => push(b, 8));
  push(0, Math.min(4, cap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let p = 0xEC; bits.length < cap * 8; p ^= 0xEC ^ 0x11) push(p, 8);
  const cw = []; for (let i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i + 8).join(""), 2));
  // Reed-Solomon
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const d = ECC[ver], div = new Array(d).fill(0); div[d - 1] = 1;
  for (let i = 0, raiz = 1; i < d; i++) { for (let j = 0; j < d; j++) { div[j] = mul(div[j], raiz); if (j + 1 < d) div[j] ^= div[j + 1]; } raiz = mul(raiz, 2); }
  const rs = bl => { const r = new Array(d).fill(0); for (const b of bl) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); } return r; };
  const nb = BLQ[ver], total = Math.floor(crudos(ver) / 8), cortos = nb - total % nb, lenCorto = Math.floor(total / nb) - d;
  const bloques = []; let k = 0;
  for (let i = 0; i < nb; i++) { const n = lenCorto + (i < cortos ? 0 : 1); const dat = cw.slice(k, k + n); k += n; const e = rs(dat); if (i < cortos) dat.push(0); bloques.push(dat.concat(e)); }
  const fin = [];
  for (let i = 0; i < bloques[0].length; i++) bloques.forEach((b, j) => { if (i !== lenCorto || j >= cortos) fin.push(b[i]); });
  // Matriz
  const N = ver * 4 + 17;
  const m = Array.from({ length: N }, () => new Array(N).fill(false));
  const fn = Array.from({ length: N }, () => new Array(N).fill(false));
  const set = (x, y, v) => { m[y][x] = v; fn[y][x] = true; };
  for (let i = 0; i < N; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const patron = (cx, cy, r, f) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const x = cx + dx, y = cy + dy; if (x >= 0 && x < N && y >= 0 && y < N) set(x, y, f(Math.max(Math.abs(dx), Math.abs(dy)))); } };
  [[3, 3], [N - 4, 3], [3, N - 4]].forEach(([x, y]) => patron(x, y, 4, t => t !== 2 && t !== 4));
  if (ver >= 2) patron(N - 7, N - 7, 2, t => t !== 1);
  const formato = mask => {
    const dt = mask; let r = dt; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((dt << 10) | r) ^ 0x5412, g = i => ((b >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, g(i));
    set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
    for (let i = 0; i < 8; i++) set(N - 1 - i, 8, g(i));
    for (let i = 8; i < 15; i++) set(8, N - 15 + i, g(i));
    set(8, N - 8, true);
  };
  formato(0);
  let i = 0;
  for (let der = N - 1; der >= 1; der -= 2) {
    if (der === 6) der = 5;
    for (let v = 0; v < N; v++) for (let j = 0; j < 2; j++) {
      const x = der - j, y = ((der + 1) & 2) === 0 ? N - 1 - v : v;
      if (!fn[y][x] && i < fin.length * 8) { m[y][x] = ((fin[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
    }
  }
  const inv = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const aplicar = mk => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!fn[y][x] && inv[mk](x, y)) m[y][x] = !m[y][x]; };
  const penal = () => {
    let p = 0;
    for (let a = 0; a < N; a++) for (const h of [true, false]) { let run = 1; for (let b = 1; b < N; b++) { const c = h ? m[a][b] === m[a][b - 1] : m[b][a] === m[b - 1][a]; if (c) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
    for (let y = 0; y < N - 1; y++) for (let x = 0; x < N - 1; x++) if (m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
    return p;
  };
  let mejor = 0, pm = Infinity;
  for (let mk = 0; mk < 8; mk++) { aplicar(mk); formato(mk); const p = penal(); if (p < pm) { pm = p; mejor = mk; } aplicar(mk); }
  aplicar(mejor); formato(mejor);
  return m;
}
function qrSVG(texto, color) {
  const m = crearQR(texto), n = m.length, q = 4;
  let ruta = "";
  m.forEach((fila, y) => fila.forEach((v, x) => { if (v) ruta += `M${x + q} ${y + q}h1v1h-1z`; }));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" shape-rendering="crispEdges" aria-hidden="true"><path fill="${color}" d="${ruta}"/></svg>`;
}
document.getElementById("qr").innerHTML = qrSVG("https://nehemiasperez.com", "#0E1116");
</script>
</body>
</html>
