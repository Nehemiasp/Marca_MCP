<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso de tiempo de respuesta</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f6f8; margin: 0; padding: 2rem 1rem; color: #1f2937; }
  .aviso {
    max-width: 640px; margin: 0 auto; display: flex; gap: 1rem; align-items: flex-start;
    background: #fff7e0; border: 2px solid #f5a623; border-left-width: 10px;
    border-radius: 10px; padding: 1.25rem 1.5rem; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .icono { font-size: 2rem; line-height: 1; }
  .aviso h2 { margin: 0 0 .25rem; font-size: 1.25rem; color: #8a5300; }
  .aviso p { margin: 0; font-size: 1.05rem; line-height: 1.5; }
  .aviso strong { color: #8a5300; }
</style>
</head>
<body>
  <div class="aviso" role="note" aria-label="Aviso importante">
    <div class="icono" aria-hidden="true">⏱️</div>
    <div>
      <h2>Tiempo de respuesta</h2>
      <p>Respondo todos los mensajes en un plazo de <strong>dos días hábiles</strong>. ¡Gracias por tu paciencia!</p>
    </div>
  </div>
</body>
</html>
