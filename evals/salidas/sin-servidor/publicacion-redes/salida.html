<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuevo portafolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;display:flex;justify-content:center}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0f0f1a;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:90px}
.c1{position:absolute;width:700px;height:700px;border-radius:50%;background:#ff4d6d;filter:blur(20px);opacity:.9;right:-250px;top:-200px}
.c2{position:absolute;width:600px;height:600px;border-radius:50%;background:#4d7cff;opacity:.8;left:-250px;bottom:-200px}
.win{position:absolute;left:90px;right:90px;top:430px;height:420px;background:#1b1b2e;border-radius:28px;border:2px solid #ffffff30;box-shadow:0 30px 80px #0008;padding:30px}
.dots span{display:inline-block;width:20px;height:20px;border-radius:50%;margin-right:12px;background:#ff5f57}
.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}
.grid{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:20px;margin-top:28px;height:310px}
.grid div{border-radius:16px;background:#ffffff18}
.grid div:first-child{grid-row:span 2;background:linear-gradient(135deg,#ff4d6d,#ffb84d)}
.grid div:nth-child(3){background:linear-gradient(135deg,#4d7cff,#4dffd2)}
.top,.bot,h1{position:relative;z-index:2}
.tag{display:inline-block;background:#fff;color:#0f0f1a;font-weight:800;font-size:30px;padding:14px 30px;border-radius:50px;letter-spacing:2px}
h1{font-size:150px;line-height:.95;font-weight:900;letter-spacing:-4px;margin-top:40px}
.bot{font-size:44px;font-weight:700}
.bot small{display:block;font-size:34px;font-weight:400;opacity:.8;margin-top:14px}
.btn{display:inline-block;background:#fff;color:#0f0f1a;padding:24px 48px;border-radius:60px;font-weight:800;margin-bottom:24px}
</style>
</head>
<body>
<div class="post">
<div class="c1"></div><div class="c2"></div>
<div class="top"><span class="tag">¡YA ESTÁ ONLINE!</span>
<h1>Mi nuevo<br>portafolio</h1></div>
<div class="win"><div class="dots"><span></span><span></span><span></span></div>
<div class="grid"><div></div><div></div><div></div></div></div>
<div class="bot"><div class="btn">Visítalo en el link de mi bio →</div>
<small>Proyectos, ideas y todo lo que he creado.</small></div>
</div>
</body>
</html>
