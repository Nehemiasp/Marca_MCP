<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portafolio nuevo · Nehemias Pérez</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-tinta: #0E1116;
    --color-oscuro-texto: #FFFFFF;
    --color-oscuro-texto-apagado: #A3ABB6;
    --color-oscuro-linea: #2A303A;
    --color-oscuro-acento: #8DB6E8;
    --font-titulo: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --font-texto: "Instrument Sans", system-ui, sans-serif;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--color-tinta); }
  .post {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--color-tinta); color: var(--color-oscuro-texto);
    font-family: var(--font-texto);
    padding: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo { width: 480px; height: auto; display: block; }
  .eyebrow {
    font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-oscuro-acento); margin-bottom: 32px;
  }
  h1 {
    font-family: var(--font-titulo); font-weight: 800; font-size: 136px; line-height: 1;
    letter-spacing: -0.02em; color: var(--color-oscuro-texto);
  }
  h1 em { font-style: normal; color: var(--color-oscuro-acento); }
  .lead { margin-top: 40px; font-size: 32px; line-height: 1.4; color: var(--color-oscuro-texto-apagado); max-width: 620px; }
  .pie { display: flex; align-items: flex-end; justify-content: space-between; }
  .cta {
    display: inline-block; padding: 24px 40px; border-radius: var(--radius-pill);
    background: var(--color-oscuro-acento); color: var(--color-tinta);
    font-weight: 700; font-size: 28px;
  }
  .motivo { width: 327px; height: auto; display: block; }
</style>
</head>
<body>
<main class="post">
  <header>
    <svg class="logo" viewBox="0 0 420 56" role="img" aria-label="Nehemias Pérez · Diseñador UI/UX">
      <rect x="0" y="0" width="26" height="26" rx="4" fill="#FFFFFF"/>
      <rect x="30" y="0" width="26" height="26" rx="4" fill="#262C35"/>
      <rect x="0" y="30" width="56" height="26" rx="13" fill="#8DB6E8"/>
      <text x="74" y="30" font-family="'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.6" fill="#FFFFFF">Nehemias Pérez</text>
      <text x="74" y="52" font-family="'Instrument Sans', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.3" fill="#8DB6E8">DISEÑADOR UI/UX</text>
    </svg>
  </header>

  <section>
    <p class="eyebrow">Portafolio nuevo</p>
    <h1>Abrí mi <em>portafolio</em> nuevo.</h1>
    <p class="lead">Proyectos, procesos y el trabajo de diseño de producto que he construido. Ya está disponible.</p>
  </section>

  <footer class="pie">
    <span class="cta">Enlace en mi perfil</span>
    <svg class="motivo" viewBox="0 0 436 324" aria-hidden="true">
      <rect x="0" y="0" width="100" height="100" rx="14" fill="#FFFFFF"/>
      <rect x="112" y="0" width="100" height="100" rx="14" fill="#262C35"/>
      <rect x="225" y="1" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/>
      <rect x="336" y="0" width="100" height="100" rx="14" fill="#FFFFFF"/>
      <rect x="0" y="112" width="100" height="100" rx="14" fill="#262C35"/>
      <rect x="112" y="112" width="212" height="100" rx="50" fill="#8DB6E8"/>
      <rect x="336" y="112" width="100" height="100" rx="14" fill="#262C35"/>
      <rect x="1" y="225" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/>
      <rect x="112" y="224" width="100" height="100" rx="14" fill="#FFFFFF"/>
      <rect x="224" y="224" width="100" height="100" rx="14" fill="#262C35"/>
      <rect x="337" y="225" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/>
    </svg>
  </footer>
</main>
</body>
</html>
