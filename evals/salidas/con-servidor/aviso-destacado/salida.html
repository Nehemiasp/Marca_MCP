<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso destacado</title>
<style>
  :root {
    --color-tinta: #0E1116;
    --color-texto: #2B2F36;
    --color-fondo: #FAFAF8;
    --color-azul: #043565;
    --color-azul-suave: #E8EFF7;
    --font-texto: "Instrument Sans", system-ui, sans-serif;
    --font-weight-negrita: 700;
    --text-base: 16px;
    --text-base--line-height: 26px;
    --radius-md: 10px;
    --spacing-sm: 8px;
    --spacing-lg: 24px;
  }
  body { margin: 0; padding: var(--spacing-lg); background: var(--color-fondo); }
  .aviso { max-width: 640px; background: var(--color-azul-suave); border-left: 4px solid var(--color-azul); border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: var(--spacing-lg); }
  .aviso__titulo { margin: 0 0 var(--spacing-sm); font: var(--font-weight-negrita) var(--text-base)/var(--text-base--line-height) var(--font-texto); color: var(--color-tinta); }
  .aviso__texto { margin: 0; font: 400 var(--text-base)/var(--text-base--line-height) var(--font-texto); color: var(--color-texto); }
</style>
</head>
<body>
<aside class="aviso" role="note">
  <p class="aviso__titulo">Importante</p>
  <p class="aviso__texto">Respondo los mensajes en un plazo de dos días hábiles.</p>
</aside>
</body>
</html>
