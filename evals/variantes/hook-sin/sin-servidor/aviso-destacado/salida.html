<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso de tiempo de respuesta</title>
<style>
  body { font-family: var(--font-texto), 'Instrument Sans', sans-serif; background: var(--color-fondo); color: var(--color-texto); margin: 0; padding: 2rem 1rem; }
  .aviso {
    max-width: 640px; margin: 0 auto; display: flex; gap: 1rem; align-items: flex-start;
    background: var(--color-suave); border: 2px solid var(--color-tinta); border-left-width: 10px;
    border-radius: var(--radius-sm); padding: 1.1rem 1.4rem;
    color: var(--color-tinta);
  }
  .aviso .icono { font-size: var(--text-2xl); line-height: 1; }
  .aviso h2 { margin: 0 0 .25rem; font-family: var(--font-titulo), 'Bricolage Grotesque', sans-serif; font-size: var(--text-lg); }
  .aviso p { margin: 0; font-size: var(--text-base); line-height: 1.4; }
</style>
</head>
<body>
  <div class="aviso" role="note" aria-label="Aviso importante">
    <div class="icono" aria-hidden="true">⏰</div>
    <div>
      <h2>Tiempo de respuesta</h2>
      <p>Respondo todos los mensajes en un plazo de <strong>dos días hábiles</strong>.</p>
    </div>
  </div>
</body>
</html>
