<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portafolio nuevo · Nehemias Pérez</title>
<style>
:root{
  --color-tinta:#0E1116;--color-texto:#2B2F36;--color-apagado:#6A707A;--color-linea:#DADDE2;
  --color-suave:#ECEDEF;--color-fondo:#FAFAF8;--color-blanco:#FFFFFF;--color-azul:#043565;
  --font-titulo:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-texto:"Instrument Sans",system-ui,sans-serif;
  --text-xs:12px;--text-lg:18px;--text-xl:22px;--text-5xl:64px;
  --spacing-base:16px;--spacing-lg:24px;--spacing-xl:32px;--spacing-2xl:48px;--spacing-4xl:96px;
  --radius-cuadro:14px;--radius-pill:999px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--color-suave)}
.post{width:1080px;height:1350px;background:var(--color-fondo);padding:var(--spacing-4xl);display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-texto);overflow:hidden}
.eyebrow{font-weight:700;font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--color-azul);margin-bottom:var(--spacing-lg)}
h1{font-family:var(--font-titulo);font-weight:800;font-size:var(--text-5xl);line-height:64px;letter-spacing:-.02em;color:var(--color-tinta)}
h1 em{font-style:normal;color:var(--color-azul)}
p{font-size:var(--text-xl);line-height:30px;color:var(--color-texto);margin-top:var(--spacing-lg);max-width:700px}
.motivo{display:block;width:100%;height:auto}
.pie{display:flex;align-items:center;justify-content:space-between}
.pie span{font-size:var(--text-lg);font-weight:600;color:var(--color-apagado)}
</style>
</head>
<body>
<main class="post">
  <svg width="420" height="56" viewBox="0 0 420 56" role="img" aria-label="Nehemias Pérez · Diseñador UI/UX"><g><rect x="0" y="0" width="26" height="26" rx="4" fill="#0E1116"/><rect x="30" y="0" width="26" height="26" rx="4" fill="#ECEDEF"/><rect x="0" y="30" width="56" height="26" rx="13" fill="#043565"/></g><text x="74" y="30" font-family="'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif" font-weight="800" font-size="30" letter-spacing="-0.6" fill="#0E1116">Nehemias Pérez</text><text x="74" y="52" font-family="'Instrument Sans',system-ui,sans-serif" font-weight="700" font-size="11" letter-spacing="1.3" fill="#043565">DISEÑADOR UI/UX</text></svg>

  <svg class="motivo" viewBox="0 0 436 324" role="img" aria-label="Motivo de marca: rejilla de cuadros"><rect x="0" y="0" width="100" height="100" rx="14" fill="#0E1116"/><rect x="112" y="0" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="225" y="1" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/><rect x="336" y="0" width="100" height="100" rx="14" fill="#0E1116"/><rect x="0" y="112" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="112" y="112" width="212" height="100" rx="50" fill="#043565"/><rect x="336" y="112" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="1" y="225" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/><rect x="112" y="224" width="100" height="100" rx="14" fill="#0E1116"/><rect x="224" y="224" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="337" y="225" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/></svg>

  <div>
    <div class="eyebrow">Novedad</div>
    <h1>Mi portafolio nuevo ya está <em>abierto</em>.</h1>
    <p>Proyectos de diseño de interfaces y experiencia de usuario, reunidos en un solo lugar. Pase a verlo.</p>
  </div>
</main>
</body>
</html>
