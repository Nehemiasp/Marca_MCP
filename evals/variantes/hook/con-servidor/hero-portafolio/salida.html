<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nehemias Pérez · Diseñador UI/UX</title>
<style>
  :root {
    --color-tinta: #0E1116; --color-texto: #2B2F36; --color-apagado: #6A707A;
    --color-linea: #DADDE2; --color-suave: #ECEDEF; --color-fondo: #FAFAF8;
    --color-blanco: #FFFFFF; --color-azul: #043565;
    --font-titulo: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --font-texto: "Instrument Sans", system-ui, sans-serif;
    --text-xs: 12px; --text-sm: 14px; --text-lg: 18px; --text-4xl: 48px; --text-5xl: 64px;
    --spacing-sm: 8px; --spacing-md: 12px; --spacing-base: 16px; --spacing-lg: 24px;
    --spacing-xl: 32px; --spacing-2xl: 48px; --spacing-4xl: 96px;
    --radius-md: 10px; --radius-cuadro: 14px; --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-fondo); color: var(--color-texto); font-family: var(--font-texto); }
  .hero {
    max-width: 1120px; margin: 0 auto;
    padding: var(--spacing-4xl) var(--spacing-lg);
    display: grid; grid-template-columns: 1fr auto; gap: var(--spacing-2xl); align-items: center;
  }
  .hero__linea { border-top: 1px solid var(--color-linea); padding-top: var(--spacing-lg); }
  .hero__eyebrow {
    margin: 0 0 var(--spacing-base);
    font: 700 var(--text-xs)/16px var(--font-texto);
    letter-spacing: .12em; text-transform: uppercase; color: var(--color-azul);
  }
  .hero__titulo {
    margin: 0 0 var(--spacing-lg); color: var(--color-tinta);
    font: 800 var(--text-5xl)/64px var(--font-titulo); letter-spacing: -.02em;
  }
  .hero__titulo em { font-style: normal; color: var(--color-azul); }
  .hero__texto { margin: 0 0 var(--spacing-xl); max-width: 52ch; font-size: var(--text-lg); line-height: 28px; }
  .hero__acciones { display: flex; flex-wrap: wrap; gap: var(--spacing-md); }
  .boton {
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 var(--text-sm)/20px var(--font-texto); text-decoration: none;
    min-height: 44px; padding: var(--spacing-md) var(--spacing-lg);
    border: 1px solid transparent; border-radius: var(--radius-md);
    transition: background-color .15s, border-color .15s;
  }
  .boton:focus-visible { outline: 2px solid var(--color-azul); outline-offset: 2px; }
  .boton--principal { background: var(--color-tinta); color: var(--color-blanco); }
  .boton--principal:hover { background: var(--color-texto); }
  .boton--secundario { color: var(--color-tinta); border-color: var(--color-linea); }
  .boton--secundario:hover { border-color: var(--color-tinta); }
  .hero__motivo { width: 300px; height: auto; display: block; }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-block: var(--spacing-2xl); }
    .hero__titulo { font-size: var(--text-4xl); line-height: 52px; }
    .hero__motivo { width: 200px; order: -1; }
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="hero__linea">
      <p class="hero__eyebrow">Nehemias Pérez · Diseñador UI/UX</p>
      <h1 class="hero__titulo">Diseño interfaces claras y <em>funcionales.</em></h1>
      <p class="hero__texto">Soy Nehemias Pérez, diseñador UI/UX. Este es mi portafolio: una selección de proyectos y la forma en que los pienso.</p>
      <div class="hero__acciones">
        <a class="boton boton--principal" href="#contacto">Escribirme</a>
        <a class="boton boton--secundario" href="#proyectos">Ver proyectos</a>
      </div>
    </div>
    <svg class="hero__motivo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 324" aria-hidden="true"><rect x="0" y="0" width="100" height="100" rx="14" fill="#0E1116"/><rect x="112" y="0" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="225" y="1" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/><rect x="336" y="0" width="100" height="100" rx="14" fill="#0E1116"/><rect x="0" y="112" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="112" y="112" width="212" height="100" rx="50" fill="#043565"/><rect x="336" y="112" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="1" y="225" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/><rect x="112" y="224" width="100" height="100" rx="14" fill="#0E1116"/><rect x="224" y="224" width="100" height="100" rx="14" fill="#ECEDEF"/><rect x="337" y="225" width="98" height="98" rx="14" fill="none" stroke="#DADDE2" stroke-width="2"/></svg>
  </section>
</main>
</body>
</html>
