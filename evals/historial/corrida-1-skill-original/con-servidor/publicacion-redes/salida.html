<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portafolio nuevo · Nehemias Pérez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-tinta: #0E1116;
    --color-oscuro-texto: #FFFFFF;
    --color-oscuro-texto-apagado: #A3ABB6;
    --color-oscuro-linea: #2A303A;
    --color-oscuro-acento: #8DB6E8;
    --font-titulo: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --font-texto: "Instrument Sans", system-ui, sans-serif;
    --spacing-md: 12px;
    --spacing-lg: 24px;
    --spacing-xl: 32px;
    --spacing-2xl: 48px;
    --spacing-4xl: 96px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--color-tinta); }
  .post {
    width: 1080px; height: 1350px;
    padding: var(--spacing-4xl);
    background: var(--color-tinta);
    color: var(--color-oscuro-texto);
    font-family: var(--font-texto);
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .logo { width: 480px; height: auto; display: block; }
  .eyebrow {
    display: inline-block;
    font-size: 18px; line-height: 28px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-oscuro-acento);
    margin-bottom: var(--spacing-lg);
  }
  h1 {
    font-family: var(--font-titulo); font-weight: 800;
    font-size: 64px; line-height: 64px; letter-spacing: -0.02em;
    color: var(--color-oscuro-texto);
    max-width: 760px;
  }
  h1 em { font-style: normal; color: var(--color-oscuro-acento); }
  .intro {
    margin-top: var(--spacing-xl);
    font-size: 22px; line-height: 30px; font-weight: 400;
    color: var(--color-oscuro-texto-apagado);
    max-width: 640px;
  }
  .pie { display: flex; align-items: flex-end; justify-content: space-between; }
  .pildora {
    display: inline-block;
    padding: var(--spacing-md) var(--spacing-lg);
    border: 2px solid var(--color-oscuro-linea);
    border-radius: var(--radius-pill);
    font-size: 18px; line-height: 28px; font-weight: 600;
    color: var(--color-oscuro-texto);
  }
  .motivo { width: 436px; height: 324px; display: block; }
</style>
</head>
<body>
<main class="post">
  <header>
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 56" role="img" aria-label="Nehemias Pérez · Diseñador UI/UX"><g><rect x="0" y="0" width="26" height="26" rx="6" fill="#FFFFFF"/><rect x="30" y="0" width="26" height="26" rx="6" fill="#262C35"/><rect x="0" y="30" width="56" height="26" rx="13" fill="#8DB6E8"/></g><text x="74" y="30" font-family="'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.6" fill="#FFFFFF">Nehemias Pérez</text><text x="74" y="52" font-family="'Instrument Sans', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.3" fill="#8DB6E8">DISEÑADOR UI/UX</text></svg>
  </header>

  <section>
    <span class="eyebrow">Portafolio 2026</span>
    <h1>Abrí mi portafolio <em>nuevo.</em></h1>
    <p class="intro">Proyectos recientes, procesos y decisiones de diseño, reunidos en un solo lugar. Pase a verlo.</p>
  </section>

  <footer class="pie">
    <span class="pildora">Ya disponible</span>
    <svg class="motivo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 324"><rect x="0" y="0" width="100" height="100" rx="14" fill="#FFFFFF"/><rect x="112" y="0" width="100" height="100" rx="14" fill="#262C35"/><rect x="225" y="1" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/><rect x="336" y="0" width="100" height="100" rx="14" fill="#FFFFFF"/><rect x="0" y="112" width="100" height="100" rx="14" fill="#262C35"/><rect x="112" y="112" width="212" height="100" rx="50" fill="#8DB6E8"/><rect x="336" y="112" width="100" height="100" rx="14" fill="#262C35"/><rect x="1" y="225" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/><rect x="112" y="224" width="100" height="100" rx="14" fill="#FFFFFF"/><rect x="224" y="224" width="100" height="100" rx="14" fill="#262C35"/><rect x="337" y="225" width="98" height="98" rx="14" fill="none" stroke="#2A303A" stroke-width="2"/></svg>
  </footer>
</main>
</body>
</html>
